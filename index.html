<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KHANHTRAVEL - FIT Operation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{--bg:#f2f7f9;--panel:#fff;--ink:#16252b;--muted:#5d727a;--line:#d8e4e8;--pri:#00AAC9;--pri-d:#0087a0;--pri-bg:#e3f6fa;--red:#ED1C24;--red-d:#A2161B;--red-bg:#fdeaea;--good:#1b8a4b;--good-bg:#e2f5ea;--warn:#b86e00;--warn-bg:#fff2dc;--on:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1a1e;--panel:#162329;--ink:#e8f2f5;--muted:#9bb2ba;--line:#294049;--pri:#17B7D1;--pri-d:#0e93aa;--pri-bg:#12303a;--red:#ff4b52;--red-d:#ff7a80;--red-bg:#3a1a1c;--good:#4fcf8a;--good-bg:#12311f;--warn:#f0b04a;--warn-bg:#352a12}}
:root[data-theme="dark"]{--bg:#0e1a1e;--panel:#162329;--ink:#e8f2f5;--muted:#9bb2ba;--line:#294049;--pri:#17B7D1;--pri-d:#0e93aa;--pri-bg:#12303a;--red:#ff4b52;--red-d:#ff7a80;--red-bg:#3a1a1c;--good:#4fcf8a;--good-bg:#12311f;--warn:#f0b04a;--warn-bg:#352a12}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 14px/1.5 "Be Vietnam Pro",system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
header.top{background:var(--panel);border-bottom:3px solid var(--pri);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.hin{max-width:1180px;margin:0 auto;padding:8px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{background:#fff;border-radius:8px;padding:2px 6px;display:flex}
.logo img{height:46px;display:block}
.ttl b{font-size:18px;display:block;line-height:1.2}.ttl span{color:var(--muted);font-size:12px}
nav{margin-left:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
nav button{background:none;border:0;padding:9px 16px;border-radius:8px;font-weight:600;color:var(--muted)}
nav button.on{background:var(--pri);color:var(--on)}
.wrap{max-width:1180px;margin:0 auto;padding:16px}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.bar input[type=search],.bar select{padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel);min-width:200px}
.sp{flex:1}
.btn{background:var(--pri);color:var(--on);border:0;border-radius:8px;padding:9px 16px;font-weight:600}
.btn:hover{background:var(--pri-d)}
.btn.red{background:var(--red)}.btn.red:hover{background:var(--red-d)}
.btn.ghost{background:var(--panel);color:var(--pri-d);border:1px solid var(--pri)}
.btn.ghost:hover{background:var(--pri-bg)}
.btn.sm{padding:5px 10px;font-size:12px}
.btn:disabled{opacity:.6;cursor:wait}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:14px}
.kpi{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--pri);border-radius:8px;padding:12px 14px}
.kpi.r{border-left-color:var(--red)}.kpi.g{border-left-color:var(--good)}
.kpi span{color:var(--muted);font-size:12px;display:block}.kpi strong{font-size:20px}
.tw{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow-x:auto}
table.t{width:100%;border-collapse:collapse;min-width:820px}
.t th{background:var(--pri-bg);color:var(--pri-d);text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.03em;padding:10px 12px;white-space:nowrap}
.t td{padding:10px 12px;border-top:1px solid var(--line);vertical-align:top}
.t tr:hover td{background:var(--pri-bg)}
.t .num{text-align:right;white-space:nowrap}
.t small{color:var(--muted);display:block}
.act{display:flex;gap:6px;flex-wrap:wrap}
.tag{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}
.tag.un{background:var(--red-bg);color:var(--red-d)}.tag.pa{background:var(--warn-bg);color:var(--warn)}.tag.ok{background:var(--good-bg);color:var(--good)}
.empty{padding:36px;text-align:center;color:var(--muted)}
.prog{height:6px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:4px;min-width:90px}.prog i{display:block;height:100%;background:var(--good)}
.ov{position:fixed;inset:0;background:rgba(10,25,30,.6);display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:calc(20px + env(safe-area-inset-top,0px)) 12px calc(20px + env(safe-area-inset-bottom,0px));z-index:20}
.ov.show{display:flex}
.modal{background:var(--panel);border-radius:12px;width:100%;max-width:760px;border-top:4px solid var(--pri)}
.mh{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line)}
.mh h2{margin:0;font-size:17px}.x{background:none;border:0;font-size:24px;line-height:1;color:var(--muted)}
.mb{padding:16px 18px}.mf{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.f label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:3px}
.f input,.f select,.f textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.f.w{grid-column:1/-1}.ck{display:flex;gap:18px;padding:8px 0}.ck label{display:flex;gap:6px;align-items:center;color:var(--ink);font-size:14px;font-weight:500;margin:0}
.ck input{width:auto}
.sec{font-weight:700;color:var(--pri-d);margin:16px 0 8px;font-size:13px;text-transform:uppercase}.sec:first-child{margin-top:0}
.pl{width:100%;border-collapse:collapse;margin:8px 0}.pl td{padding:6px 4px;border-bottom:1px solid var(--line)}.pl td:nth-child(2){text-align:right}
.sum{display:flex;gap:16px;flex-wrap:wrap;background:var(--pri-bg);border-radius:8px;padding:10px 14px;margin-bottom:12px}
.vw{overflow-x:auto;background:#cfd8dc;padding:12px;border-radius:0 0 12px 12px}
#voucher{display:flex;flex-direction:column;width:794px;min-height:1123px;background:#fff;color:#1b2a30;padding:40px 48px;margin:0 auto;font-family:"Be Vietnam Pro",Arial,sans-serif;font-size:14px;line-height:1.5;position:relative}
#voucher .vh{display:flex;justify-content:space-between;align-items:center;border-bottom:4px solid #00AAC9;padding-bottom:12px}
#voucher .vh img{height:64px}
#voucher .vh>div{text-align:right;font-size:12px;color:#5d727a}
#voucher h1{text-align:center;font-size:22px;color:#00AAC9;margin:22px 0 2px;letter-spacing:.02em}
#voucher .sub{text-align:center;color:#5d727a;font-size:12px;margin-bottom:16px}
#voucher .code{text-align:center;margin-bottom:18px}#voucher .code span{display:inline-block;border:2px solid #ED1C24;color:#A2161B;font-weight:700;font-size:18px;padding:4px 18px;border-radius:6px}
#voucher table{width:100%;border-collapse:collapse}
#voucher td{padding:8px 10px;border:1px solid #d8e4e8;vertical-align:top}
#voucher td:first-child{width:34%;background:#e8f7fb;font-weight:600;color:#0087a0}
#voucher .pol{margin-top:14px;border:1px solid #d8e4e8;border-left:4px solid #ED1C24;padding:10px 14px;white-space:pre-wrap}
#voucher .pol b{color:#A2161B;display:block;margin-bottom:2px}
#voucher .ft{margin-top:auto;border-top:3px solid #00AAC9;padding-top:10px;font-size:11px;color:#5d727a;text-align:center;line-height:1.6}#voucher .ft b{color:#1b2a30;font-size:12px}#voucher .nt{margin-top:18px;padding-bottom:18px;font-size:12px;color:#5d727a;text-align:center}
.lang{display:flex;border:1px solid var(--pri);border-radius:8px;overflow:hidden}.lang button{border:0;background:none;padding:6px 11px;font-weight:700;color:var(--pri-d)}.lang button.on{background:var(--pri);color:var(--on)}
body{min-height:100vh;display:flex;flex-direction:column}main.wrap{flex:1;width:100%}
footer.foot{background:var(--panel);border-top:3px solid var(--pri);margin-top:20px;color:var(--muted);font-size:13px}footer.foot .fi{max-width:1180px;margin:0 auto;padding:14px 16px;display:flex;flex-wrap:wrap;gap:4px 22px;align-items:center}footer.foot b{color:var(--ink)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:8px;z-index:40;display:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

 {id:2,bd:'2026-10-03',hotel:'Khách sạn Mường Thanh Luxury Đà Nẵng',addr:'270 Võ Nguyên Giáp, Sơn Trà, Đà Nẵng',tel:'0236 3 928 888',code:'KT-261003-002',guest:'TRAN THI BICH',ci:'2026-11-02',co:'2026-11-04',adults:2,kids:0,rooms:1,type:'Superior Twin',rate:1500000,vat:true,bf:false,pol:P,pays:[]}]}
 S.forEach(b=>{b.bd=b.bd||'';b.pays=b.pays||[]})}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const nights=b=>Math.max(1,Math.round((new Date(b.co)-new Date(b.ci))/864e5)||1);
const total=b=>b.rate*b.rooms*nights(b);
const paid=b=>b.pays.reduce((s,p)=>s+p.a,0);
function st(b){const t=total(b),p=paid(b);return p<=0?['un',tr('un')]:p<t?['pa',tr('pa')]:['ok',tr('ok')]}
const mLbl=m=>({mBank:tr('mBank'),mCash:tr('mCash'),mCard:tr('mCard')}[m]||m);
function toast(m){const t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',3000)}
function setLang(l){lang=l;try{localStorage.setItem(LKEY,l)}catch(e){}applyLang()}
function applyLang(){
 document.documentElement.lang=lang;
 $('sub').textContent=tr('sub');$('n-bk').textContent=tr('navBk');$('n-pay').textContent=tr('navPay');
 $('l-vi').classList.toggle('on',lang==='vi');$('l-en').classList.toggle('on',lang==='en');
 $('foot').innerHTML=`<b>${CO.name}</b><span>${tr('fAddrL')}: ${CO.addr}</span><span>${tr('fTelL')}: ${CO.tel}</span><span>${tr('fFaxL')}: ${CO.fax}</span>`;
 render()}
function tab(v){view=v;$('n-bk').classList.toggle('on',v==='bk');$('n-pay').classList.toggle('on',v==='pay');render()}
function list(){const k=q.trim().toLowerCase();return S.filter(b=>(!k||[b.hotel,b.code,b.guest].join(' ').toLowerCase().includes(k))&&(!flt||st(b)[0]===flt))}
const opts=a=>`<option value="">${a}</option><option value="un">${tr('un')}</option><option value="pa">${tr('pa')}</option><option value="ok">${tr('ok')}</option>`;
const gl=b=>`${b.adults} ${tr('adt')}${b.kids?', '+b.kids+' '+tr('chd'):''}`;
function render(){
 const rows=list();let h='';
 if(view==='bk'){
  h+=`<div class="bar"><input type="search" id="q" placeholder="${esc(tr('search'))}" value="${esc(q)}" aria-label="${esc(tr('search'))}"><select id="fl">${opts(tr('allSt'))}</select><span class="sp"></span><button class="btn" onclick="edit()">${tr('create')}</button></div>`;
  h+=rows.length?`<div class="tw"><table class="t"><thead><tr><th>${tr('cCode')}</th><th>${tr('cBd')}</th><th>${tr('cHotel')}</th><th>${tr('cGuest')}</th><th>${tr('cDates')}</th><th>${tr('cRoom')}</th><th>${tr('cPay')}</th><th>${tr('cAct')}</th></tr></thead><tbody>${rows.map(b=>{const s=st(b);return `<tr><td><b>${esc(b.code)}</b></td><td>${dmy(b.bd)}</td><td><b>${esc(b.hotel)}</b><small>${esc(b.addr)}</small></td><td>${esc(b.guest)}<small>${gl(b)}</small></td><td>${dmy(b.ci)} – ${dmy(b.co)}<small>${nights(b)} ${tr('night',nights(b))}</small></td><td>${b.rooms} × ${esc(b.type)}</td><td><span class="tag ${s[0]}">${s[1]}</span><small>${vnd(total(b))}</small></td><td><div class="act"><button class="btn sm" onclick="voucher(${b.id})">${tr('voucher')}</button><button class="btn sm ghost" onclick="payM(${b.id})">${tr('payBtn')}</button><button class="btn sm ghost" onclick="edit(${b.id})">${tr('editBtn')}</button><button class="btn sm red" onclick="del(${b.id})">${tr('delBtn')}</button></div></td></tr>`}).join('')}</tbody></table></div>`:`<div class="tw"><div class="empty">${tr('empty')}</div></div>`;
 }else{
  const T=S.reduce((s,b)=>s+total(b),0),P=S.reduce((s,b)=>s+paid(b),0);
  h+=`<div class="cards"><div class="kpi"><span>${tr('kT')}</span><strong>${vnd(T)}</strong></div><div class="kpi g"><span>${tr('kP')}</span><strong>${vnd(P)}</strong></div><div class="kpi r"><span>${tr('kR')}</span><strong>${vnd(Math.max(0,T-P))}</strong></div></div>`;
  h+=`<div class="bar"><select id="fl" aria-label="${esc(tr('cSt'))}">${opts(tr('allSt2'))}</select></div>`;
  h+=rows.length?`<div class="tw"><table class="t"><thead><tr><th>${tr('cCode')}</th><th>${tr('cHotel')} / ${tr('cGuest')}</th><th class="num">${tr('cTot')}</th><th class="num">${tr('cPaid')}</th><th class="num">${tr('cRem')}</th><th>${tr('cSt')}</th><th></th></tr></thead><tbody>${rows.map(b=>{const s=st(b),t=total(b),p=paid(b);return `<tr><td><b>${esc(b.code)}</b></td><td>${esc(b.hotel)}<small>${esc(b.guest)}</small></td><td class="num">${vnd(t)}</td><td class="num">${vnd(p)}<div class="prog"><i style="width:${Math.min(100,t?p/t*100:0)}%"></i></div></td><td class="num">${vnd(Math.max(0,t-p))}</td><td><span class="tag ${s[0]}">${s[1]}</span></td><td><button class="btn sm" onclick="payM(${b.id})">${tr('rec')}</button></td></tr>`}).join('')}</tbody></table></div>`:`<div class="tw"><div class="empty">${tr('noData')}</div></div>`;
 }
 $('main').innerHTML=h;
 const qi=$('q');if(qi)qi.oninput=e=>{q=e.target.value;const p=e.target.selectionStart;render();const n=$('q');n.focus();n.setSelectionRange(p,p)};
 const f=$('fl');if(f){f.value=flt;f.onchange=e=>{flt=e.target.value;render()}}
}
function open_(h){$('modal').innerHTML=h;$('ov').classList.add('show')}
function close_(){$('ov').classList.remove('show');$('modal').innerHTML=''}
$('ov').addEventListener('mousedown',e=>{if(e.target.id==='ov')close_()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')close_()});
const fld=(l,id,v,t='text',x='')=>`<div class="f"><label for="${id}">${l}</label><input id="${id}" type="${t}" value="${esc(v)}" ${x}></div>`;
const xb=()=>`<button class="x" onclick="close_()" aria-label="${esc(tr('close'))}">×</button>`;
function edit(id){
 const b=S.find(x=>x.id===id)||{bd:today(),hotel:'',addr:'',tel:'',code:'KT-'+today().slice(2).replace(/-/g,'')+'-'+String(S.length+1).padStart(3,'0'),guest:'',ci:'',co:'',adults:2,kids:0,rooms:1,type:'',rate:'',vat:true,bf:true,pol:tr('pol')};
 open_(`<div class="mh"><h2>${id?tr('mEdit'):tr('mNew')}</h2>${xb()}</div><div class="mb">
 <div class="sec">${tr('secH')}</div><div class="g2">${fld(tr('fHotel'),'f_hotel',b.hotel)}${fld(tr('fTel'),'f_tel',b.tel,'tel')}<div class="f w">${fld(tr('fAddr'),'f_addr',b.addr)}</div></div>
 <div class="sec">${tr('secB')}</div><div class="g2">${fld(tr('fBd'),'f_bd',b.bd,'date')}${fld(tr('fCode'),'f_code',b.code)}${fld(tr('fGuest'),'f_guest',b.guest)}${fld(tr('fCi'),'f_ci',b.ci,'date')}${fld(tr('fCo'),'f_co',b.co,'date')}${fld(tr('fAd'),'f_ad',b.adults,'number','min="1"')}${fld(tr('fKd'),'f_kd',b.kids,'number','min="0"')}${fld(tr('fRm'),'f_rm',b.rooms,'number','min="1"')}${fld(tr('fType'),'f_type',b.type)}${fld(tr('fRate'),'f_rate',b.rate,'number','min="0" step="1000"')}</div>
 <div class="sec">${tr('secInc')}</div><div class="ck"><label><input type="checkbox" id="f_vat" ${b.vat?'checked':''}>${tr('vat')}</label><label><input type="checkbox" id="f_bf" ${b.bf?'checked':''}>${tr('bf')}</label></div>
 <div class="sec">${tr('secPol')}</div><div class="f"><textarea id="f_pol" rows="4" aria-label="${esc(tr('secPol'))}">${esc(b.pol)}</textarea></div><p id="err" role="alert" style="color:var(--red-d);margin:8px 0 0"></p></div>
 <div class="mf"><button class="btn ghost" onclick="close_()">${tr('cancel')}</button><button class="btn" onclick="submit(${id||0})">${tr('save')}</button></div>`)
}
function submit(id){
 const v=k=>$('f_'+k).value.trim();
 const b={id:id||Date.now(),bd:v('bd'),hotel:v('hotel'),addr:v('addr'),tel:v('tel'),code:v('code'),guest:v('guest'),ci:v('ci'),co:v('co'),adults:Math.max(1,+v('ad')||1),kids:Math.max(0,+v('kd')||0),rooms:Math.max(1,+v('rm')||1),type:v('type'),rate:+v('rate'),vat:$('f_vat').checked,bf:$('f_bf').checked,pol:$('f_pol').value.trim(),pays:[]};
 if(!b.bd||!b.hotel||!b.code||!b.guest||!b.ci||!b.co||!b.type||v('rate')===''||!(b.rate>=0))return $('err').textContent=tr('eReq');
 if(b.co<=b.ci)return $('err').textContent=tr('eDate');
 if(S.some(x=>x.code===b.code&&x.id!==b.id))return $('err').textContent=tr('eDup');
 const o=S.find(x=>x.id===b.id);
 if(o){b.pays=o.pays;S[S.indexOf(o)]=b}else S.unshift(b);
 save();close_();render();toast(tr('saved'))
}
function del(id){const b=S.find(x=>x.id===id);open_(`<div class="mh"><h2>${tr('delT')}</h2>${xb()}</div><div class="mb">${tr('delQ').replace('{0}','<b>'+esc(b.code)+'</b> – '+esc(b.guest))}</div><div class="mf"><button class="btn ghost" onclick="close_()">${tr('keep')}</button><button class="btn red" onclick="S=S.filter(x=>x.id!==${id});save();close_();render()">${tr('delBtn')}</button></div>`)}
function payM(id){
 const b=S.find(x=>x.id===id),t=total(b),p=paid(b),r=Math.max(0,t-p),s=st(b);
 open_(`<div class="mh"><h2>${tr('pT')} · ${esc(b.code)}</h2>${xb()}</div><div class="mb">
 <div class="sum"><div>${tr('cTot')}<br><b>${vnd(t)}</b></div><div>${tr('cPaid')}<br><b>${vnd(p)}</b></div><div>${tr('cRem')}<br><b>${vnd(r)}</b></div><div>${tr('cSt')}<br><span class="tag ${s[0]}">${s[1]}</span></div></div>
 <small style="color:var(--muted)">${esc(b.hotel)} · ${esc(b.guest)} · ${b.rooms} ${tr('rooms')} × ${nights(b)} ${tr('night',nights(b))} × ${vnd(b.rate)}</small>
 <div class="sec" style="margin-top:14px">${tr('pHist')}</div>
 ${b.pays.length?`<table class="pl">${b.pays.map((x,i)=>`<tr><td>${dmy(x.d)} · ${esc(mLbl(x.m))}<br><small style="color:var(--muted)">${esc(x.n)}</small></td><td><b>${vnd(x.a)}</b></td><td style="width:50px"><button class="btn sm red" onclick="rmPay(${id},${i})" aria-label="${esc(tr('delBtn'))}">×</button></td></tr>`).join('')}</table>`:`<div style="color:var(--muted)">${tr('pNone')}</div>`}
 <div class="sec">${tr('pNew')}</div><div class="g2">${fld(tr('pDate'),'p_d',today(),'date')}${fld(tr('pAmt'),'p_a',r||'','number','min="0" step="1000"')}<div class="f"><label for="p_m">${tr('pMeth')}</label><select id="p_m"><option value="mBank">${tr('mBank')}</option><option value="mCash">${tr('mCash')}</option><option value="mCard">${tr('mCard')}</option></select></div>${fld(tr('pNote'),'p_n','')}</div><p id="err" role="alert" style="color:var(--red-d);margin:8px 0 0"></p></div>
 <div class="mf"><button class="btn ghost" onclick="close_()">${tr('close')}</button><button class="btn" onclick="addPay(${id})">${tr('rec')}</button></div>`)
}
function addPay(id){const a=+$('p_a').value;if(!(a>0)||!$('p_d').value)return $('err').textContent=tr('pErr');
 S.find(x=>x.id===id).pays.push({d:$('p_d').value,a,m:$('p_m').value,n:$('p_n').value.trim()});save();render();payM(id);toast(tr('pOk'))}
function rmPay(id,i){S.find(x=>x.id===id).pays.splice(i,1);save();render();payM(id)}
function voucher(id){
 const b=S.find(x=>x.id===id),inc=[b.vat&&tr('vat'),b.bf&&tr('bf')].filter(Boolean).join(', ')||tr('vNone');
 const r=(l,v)=>`<tr><td>${l}</td><td>${v}</td></tr>`;
 const guests=b.adults+' '+tr('adults',b.adults)+(b.kids?', '+b.kids+' '+tr('kids',b.kids):'');
 open_(`<div class="mh"><h2>${tr('vModal')} · ${esc(b.code)}</h2>${xb()}</div>
 <div class="vw"><div id="voucher"><div class="vh"><img src="${logoSrc}" alt="KHANHTRAVEL"><div><b style="color:#00AAC9;font-size:14px">${CO.name}</b></div></div>
 <h1>${tr('vTitle')}</h1><div class="sub">${tr('vSub')}</div><div class="code"><span>${esc(b.code)}</span></div>
 <table>${r(tr('vBd'),dmy(b.bd))}${r(tr('vHotel'),'<b>'+esc(b.hotel)+'</b>')}${r(tr('vAddr'),esc(b.addr)||'–')}${r(tr('vTel'),esc(b.tel)||'–')}${r(tr('vGuest'),'<b>'+esc(b.guest)+'</b>')}${r(tr('vCi'),dmy(b.ci))}${r(tr('vCo'),dmy(b.co)+' ('+nights(b)+' '+tr('night',nights(b))+')')}${r(tr('vGuests'),guests)}${r(tr('vRooms'),b.rooms)}${r(tr('vType'),esc(b.type))}${r(tr('vInc'),inc)}</table>
 <div class="pol"><b>${tr('secPol')}</b>${esc(b.pol===D.vi.pol||b.pol===D.en.pol?tr('pol'):b.pol)||'–'}</div>
 <div class="nt">${tr('vNote')} · ${tr('vIssued')}: ${dmy(today())}</div>
 <div class="ft"><b>${CO.name}</b><br>${tr('fAddrL')}: ${CO.addr}<br>${tr('fTelL')}: ${CO.tel} · ${tr('fFaxL')}: ${CO.fax}</div></div></div>
 <div class="mf" style="border-radius:0 0 12px 12px"><button class="btn ghost" onclick="close_()">${tr('close')}</button><button class="btn" id="dl" onclick="pdf(${id})">${tr('dl')}</button></div>`)
}
const clean=s=>String(s).replace(/[\\\/:*?"<>|\u0000-\u001f]+/g,' ').replace(/\s+/g,' ').trim();
const dm=d=>d.slice(8,10)+'.'+d.slice(5,7);
const fileName=b=>`[CF] - ${clean(b.hotel)} - ${clean(b.guest)} - ${dm(b.ci)} ${dm(b.co)}.pdf`;
function loadJs(u){return new Promise((ok,no)=>{const e=document.createElement('script');e.src=u;e.onload=ok;e.onerror=no;document.head.appendChild(e)})}
async function libs(){
 if(!window.html2canvas)await loadJs('https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js');
 if(!window.jspdf)await loadJs('https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js');
 if(!window.html2canvas||!window.jspdf)throw new Error('lib')}
async function saveFile(name,buf){
 const dl=window.claude&&claude.use?await claude.use('downloads').catch(()=>null):null;
 if(dl)return dl.save({filename:name,data:buf});
 const u=URL.createObjectURL(new Blob([buf],{type:'application/pdf'})),a=document.createElement('a');
 a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000)}
async function pdf(id){
 const b=S.find(x=>x.id===id),btn=$('dl');btn.disabled=true;btn.textContent=tr('dling');
 try{
  await libs();
  await document.fonts.ready;
  const c=await html2canvas($('voucher'),{scale:2,backgroundColor:'#fff',useCORS:true});
  const doc=new jspdf.jsPDF('p','mm','a4'),h=c.height*210/c.width,img=c.toDataURL('image/jpeg',.95);
  for(let i=0;i<Math.max(1,Math.ceil((h-1)/297));i++){if(i)doc.addPage();doc.addImage(img,'JPEG',0,-i*297,210,h)}
  await saveFile(fileName(b),doc.output('arraybuffer'));
  toast(tr('dlOk'));
 }catch(e){if(!e||e.code!=='declined')toast(tr('dlErr'))}
 finally{const n=$('dl');if(n){n.disabled=false;n.textContent=tr('dl')}}
}
load();applyLang();
</script>
</body>
